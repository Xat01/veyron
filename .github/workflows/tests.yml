name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install VEYRON and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest bandit

      # Gitleaks is a static Go binary; installing it lets the secret-scan
      # integration test run instead of skipping.
      - name: Install Gitleaks
        run: |
          curl -sSfL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Semgrep is the primary multi-language SAST engine, so it is installed
      # in CI rather than left to skip. The adapter pins a named registry
      # ruleset (p/default) and disables telemetry metrics.
      - name: Install Semgrep
        run: |
          pip install semgrep
          semgrep --version

      - name: Run test suite
        run: pytest -q

      # The repository must never contain a real secret. This mirrors the
      # pre-commit discipline described in SECURITY.md.
      - name: Secret scan (gitleaks, git history)
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1
